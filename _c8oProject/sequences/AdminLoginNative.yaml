↓CheckAuthResponse [steps.SimpleStep-1998000000012]: 
  comment: A login answer without a token is an error (old DRF-JWT non_field_errors, current Baserow error/detail, throttling, non JSON answer), and so is a 2FA answer whose token is only a temporary verification token
  expression: |
    'authError = null;
    // the answer of token-auth as JSON text, parsed here (a non JSON answer has no token)
    authResponse = null;
    try {
    	authResponse = auth_text == null ? null : JSON.parse("" + auth_text);
    } catch (e) {
    	authResponse = null;
    }
    auth_text = null;
    var authAnswer = authResponse;
    var authText = function(value) {
    	if (value == null) {
    		return "";
    	}
    	if (Array.isArray(value)) {
    		var texts = [];
    		for (var iValue = 0; iValue < value.length; iValue++) {
    			var itemText = authText(value[iValue]);
    			if (itemText != "") {
    				texts.push(itemText);
    			}
    		}
    		return texts.join(" ");
    	}
    	if (typeof value == "object") {
    		if (value.value != null && typeof value.value != "object") {
    			return ("" + value.value).replace(/^\s+|\s+$/g, "");
    		}
    		return JSON.stringify(value);
    	}
    	return ("" + value).replace(/^\s+|\s+$/g, "");
    };
    var authToken = authAnswer != null && typeof authAnswer == "object" ? authText(authAnswer.access_token) : "";
    if (authToken == "" || authToken == "null") {
    	authToken = authAnswer != null && typeof authAnswer == "object" ? authText(authAnswer.token) : "";
    }
    var authTwoFactor = authAnswer != null && typeof authAnswer == "object" ? authText(authAnswer.two_factor_auth) : "";
    if (authTwoFactor != "") {
    	authError = "Baserow authentication failed: the Baserow account has two-factor authentication enabled (" + authTwoFactor + "), which is not supported";
    } else if (authToken == "" || authToken == "null") {
    	var authCode = authAnswer != null && typeof authAnswer == "object" ? authText(authAnswer.error) : "";
    	var authDetail = authAnswer != null && typeof authAnswer == "object" ? authText(authAnswer.detail != null ? authAnswer.detail : authAnswer.non_field_errors) : "";
    	authError = authCode != "" && authDetail != "" ? authCode + ": " + authDetail : (authCode != "" ? authCode : authDetail);
    	if (authError == "") {
    		authError = "Baserow authentication failed: no token in the answer";
    	}
    }
    '
