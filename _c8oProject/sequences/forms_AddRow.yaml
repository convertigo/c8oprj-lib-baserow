    				if(jDoc.variable.resp[key].type == "img" || jDoc.variable.resp[key].type == "file" || jDoc.variable.resp[key].type == "signature"){
    					columnToBeCreated.push({name: key, type: "file"});
    					data[key] = [];
    				}
    				else{
    					columnToBeCreated.push({name: key, type: "text"});
    					if(typeof jDoc.variable.resp[key] == "string"){
    						data[key] = jDoc.variable.resp[key];
    					}
    					else{
    						data[key] = typeof jDoc.variable.resp[key].value != "object" ? jDoc.variable.resp[key].value : JSON.stringify(jDoc.variable.resp[key].value);
    					}
    				}
    			}
    			else{
    				log.debug("** column [" + key + "] does not exist in the target table: it is skipped");
    			}
    			break;
    		default:
    			log.warn("** type: " + type + " is not yet handled")
    	}
    }
    // an answer matching no option of a select column is returned as an error by the next step: no row is written
    var fieldErrorMessage = fieldErrors.join("; ");
    // with columns to create, the attachments are uploaded once, after the columns are created (a first upload was lost)
    var attachmentKeys = forms_createColumn == "true" && columnToBeCreated.length > 0 ? [] : Object.keys(jDoc.variable.resp);
    
    var sjDoc = JSON.stringify(jDoc);
    
