↓forms_appendFiles [variables.RequestableVariable-2026111601010]: 
  comment: |
    '{
        "en": {
            "comment": "When the row is updated (Identifier set), the files sent to a file column are added to the files the row already has, each file once, instead of replacing them. A file column sent without a new file keeps its files",
            "displayName": "Add the files to the existing ones"
        },
        "fr": {
            "comment": "Quand la ligne est mise à jour (Identifiant renseigné), les fichiers envoyés dans une colonne fichier s''ajoutent à ceux que la ligne a déjà, chaque fichier une seule fois, au lieu de les remplacer. Une colonne fichier envoyée sans nouveau fichier garde ses fichiers",
            "displayName": "Ajouter les fichiers aux fichiers existants"
        },
        "es": {
            "comment": "Cuando se actualiza la fila (Identificador definido), los archivos enviados a una columna de archivos se añaden a los que ya tiene la fila, cada archivo una sola vez, en lugar de reemplazarlos. Una columna de archivos enviada sin archivo nuevo conserva sus archivos",
            "displayName": "Añadir los archivos a los existentes"
        },
        "it": {
            "comment": "Quando la riga viene aggiornata (Identificatore impostato), i file inviati a una colonna di file si aggiungono a quelli che la riga ha già, ogni file una sola volta, invece di sostituirli. Una colonna di file inviata senza nuovo file mantiene i suoi file",
            "displayName": "Aggiungi i file a quelli esistenti"
        }
    }'
  description: boolean=false
