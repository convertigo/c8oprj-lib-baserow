↓forms_tableDistinct [variables.RequestableVariable-1996000000114]: 
  comment: |
    '{
        "en": {
            "comment": "<b>Optional.</b><br/>Enter one or more column names separated by commas to remove duplicates.<br/><b>Example:</b> <code>Country,City</code><br/><b>Result:</b> only the first row found for each combination of values is kept.<br/><b>Use this field when you want one line per unique combination.</b>",
            "displayName": "Distinct column"
        },
        "fr": {
            "comment": "<b>Optionnel.</b><br/>Saisissez un ou plusieurs noms de colonnes séparés par des virgules pour supprimer les doublons.<br/><b>Exemple :</b> <code>Country,City</code><br/><b>Résultat :</b> seule la première ligne trouvée pour chaque combinaison de valeurs est conservée.<br/><b>Utilisez ce champ si vous voulez une ligne par combinaison unique.</b>",
            "displayName": "Colonne distincte"
        },
        "es": {
            "comment": "<b>Opcional.</b><br/>Introduzca uno o varios nombres de columnas separados por comas para eliminar duplicados.<br/><b>Ejemplo:</b> <code>Country,City</code><br/><b>Resultado:</b> solo se conserva la primera fila encontrada para cada combinación de valores.<br/><b>Use este campo si desea una línea por combinación única.</b>",
            "displayName": "Columna distinta"
        },
        "it": {
            "comment": "<b>Opzionale.</b><br/>Inserisci uno o più nomi di colonne separati da virgole per rimuovere i duplicati.<br/><b>Esempio:</b> <code>Country,City</code><br/><b>Risultato:</b> viene mantenuta solo la prima riga trovata per ogni combinazione di valori.<br/><b>Usa questo campo se vuoi una riga per ogni combinazione unica.</b>",
            "displayName": "Colonna distinta"
        }
    }
    '
  description: distinct_column
↓forms_tableGroupBy [variables.RequestableVariable-1996000000115]: 
  comment: |
    '{
        "en": {
            "comment": "<b>Optional.</b><br/>Enter one or more column names separated by commas to group the rows.<br/><b>Example:</b> <code>Service,Region</code><br/><b>Result:</b> one row per combination of values, with the aggregation columns defined below.<br/><b>If Aggregations is empty, a <code>count</code> column is returned by default.</b><br/><b>If this field is filled in, Distinct is ignored.</b>",
            "displayName": "Group by"
        },
        "fr": {
            "comment": "<b>Optionnel.</b><br/>Saisissez un ou plusieurs noms de colonnes séparés par des virgules pour regrouper les lignes.<br/><b>Exemple :</b> <code>Service,Région</code><br/><b>Résultat :</b> une ligne par combinaison de valeurs, avec les colonnes d''agrégation définies ci-dessous.<br/><b>Si Agrégations est vide, une colonne <code>count</code> est renvoyée par défaut.</b><br/><b>Si ce champ est renseigné, Colonne distincte est ignoré.</b>",
            "displayName": "Regrouper par"
        },
        "es": {
            "comment": "<b>Opcional.</b><br/>Introduzca uno o varios nombres de columnas separados por comas para agrupar las filas.<br/><b>Ejemplo:</b> <code>Servicio,Región</code><br/><b>Resultado:</b> una línea por combinación de valores, con las columnas de agregación definidas a continuación.<br/><b>Si Agregaciones está vacío, se devolverá una columna <code>count</code> por defecto.</b><br/><b>Si este campo se completa, Columna distinta se ignorará.</b>",
            "displayName": "Agrupar por"
        },
        "it": {
            "comment": "<b>Opzionale.</b><br/>Inserisci uno o più nomi di colonne separati da virgole per raggruppare le righe.<br/><b>Esempio:</b> <code>Servizio,Regione</code><br/><b>Risultato:</b> una riga per ogni combinazione di valori, con le colonne di aggregazione definite qui sotto.<br/><b>Se Aggregazioni è vuoto, viene restituita per impostazione predefinita una colonna <code>count</code>.</b><br/><b>Se questo campo è valorizzato, Colonna distinta viene ignorato.</b>",
            "displayName": "Raggruppa per"
        }
    }
    '
  description: group_by_columns
↓forms_tableAggregations [variables.RequestableVariable-1996000000116]: 
  comment: |
    '{
        "en": {
            "comment": "<b>Optional.</b><br/>The aggregations of the footer of a Baserow grid (Summarize), separated by commas: <code>count</code> or <code>type:Column</code>.<br/><b>With Group by:</b> one value per group. <b>Without Group by:</b> one row for the whole table.<br/><b>Types:</b><ul><li><code>count</code> (rows), <code>empty_count</code>, <code>not_empty_count</code>, <code>empty_percentage</code>, <code>not_empty_percentage</code>, <code>unique_count</code></li><li><code>checked_count</code>, <code>not_checked_count</code>, <code>checked_percentage</code>, <code>not_checked_percentage</code> for boolean columns</li><li><code>sum</code>, <code>avg</code>, <code>median</code>, <code>std_dev</code>, <code>variance</code> for numeric columns</li><li><code>min</code>, <code>max</code> for numeric or date columns, <code>earliest_date</code>, <code>latest_date</code> for date columns</li><li><code>distribution</code>: the 10 most frequent values with their count and share</li></ul><b>Examples:</b> <code>count</code>, <code>sum:Amount</code>, <code>empty_percentage:Email</code>, <code>latest_date:Created</code><br/><b>Label:</b> add <code>=Label</code> to name the value in chart legends and grid headers, for example <code>sum:Amount=Revenue</code> or <code>count=Deals</code>. Without a label, it reads <i>Sum · Amount</i> in the language of the user.<br/><b>Whole table:</b> the c8oforms plugin of Baserow computes them on all the rows. Without it, only <code>count</code>, <code>sum</code>, <code>avg</code>, <code>min</code> and <code>max</code> with Group by are computed, on the rows read; the others answer an error.<br/><b>If this field is empty, <code>count</code> is used by default with Group by.</b>",
            "displayName": "Aggregations"
        },
        "fr": {
            "comment": "<b>Optionnel.</b><br/>Les agrégations du pied d''une grille Baserow (Résumer), séparées par des virgules : <code>count</code> ou <code>type:Colonne</code>.<br/><b>Avec Regrouper par :</b> une valeur par groupe. <b>Sans Regrouper par :</b> une ligne pour toute la table.<br/><b>Types :</b><ul><li><code>count</code> (lignes), <code>empty_count</code>, <code>not_empty_count</code>, <code>empty_percentage</code>, <code>not_empty_percentage</code>, <code>unique_count</code></li><li><code>checked_count</code>, <code>not_checked_count</code>, <code>checked_percentage</code>, <code>not_checked_percentage</code> pour les colonnes booléennes</li><li><code>sum</code>, <code>avg</code>, <code>median</code>, <code>std_dev</code>, <code>variance</code> pour les colonnes numériques</li><li><code>min</code>, <code>max</code> pour les colonnes numériques ou de date, <code>earliest_date</code>, <code>latest_date</code> pour les colonnes de date</li><li><code>distribution</code> : les 10 valeurs les plus fréquentes avec leur nombre et leur part</li></ul><b>Exemples :</b> <code>count</code>, <code>sum:Montant</code>, <code>empty_percentage:Email</code>, <code>latest_date:Créé le</code><br/><b>Libellé :</b> ajoutez <code>=Libellé</code> pour nommer la valeur dans les légendes des graphiques et les en-têtes des grilles, par exemple <code>sum:Montant=Chiffre d''affaires</code> ou <code>count=Affaires</code>. Sans libellé, elle s''affiche <i>Somme · Montant</i> dans la langue de l''utilisateur.<br/><b>Toute la table :</b> le plugin c8oforms de Baserow les calcule sur toutes les lignes. Sans lui, seuls <code>count</code>, <code>sum</code>, <code>avg</code>, <code>min</code> et <code>max</code> avec Regrouper par sont calculés, sur les lignes lues ; les autres répondent une erreur.<br/><b>Si ce champ est vide, <code>count</code> est utilisé par défaut avec Regrouper par.</b>",
            "displayName": "Agrégations"
        },
        "es": {
            "comment": "<b>Opcional.</b><br/>Las agregaciones del pie de una cuadrícula de Baserow (Resumir), separadas por comas: <code>count</code> o <code>tipo:Columna</code>.<br/><b>Con Agrupar por:</b> un valor por grupo. <b>Sin Agrupar por:</b> una fila para toda la tabla.<br/><b>Tipos:</b><ul><li><code>count</code> (filas), <code>empty_count</code>, <code>not_empty_count</code>, <code>empty_percentage</code>, <code>not_empty_percentage</code>, <code>unique_count</code></li><li><code>checked_count</code>, <code>not_checked_count</code>, <code>checked_percentage</code>, <code>not_checked_percentage</code> para las columnas booleanas</li><li><code>sum</code>, <code>avg</code>, <code>median</code>, <code>std_dev</code>, <code>variance</code> para las columnas numéricas</li><li><code>min</code>, <code>max</code> para las columnas numéricas o de fecha, <code>earliest_date</code>, <code>latest_date</code> para las columnas de fecha</li><li><code>distribution</code>: los 10 valores más frecuentes con su número y su parte</li></ul><b>Ejemplos:</b> <code>count</code>, <code>sum:Importe</code>, <code>empty_percentage:Email</code>, <code>latest_date:Creado</code><br/><b>Etiqueta:</b> añada <code>=Etiqueta</code> para nombrar el valor en las leyendas de los gráficos y los encabezados de las tablas, por ejemplo <code>sum:Importe=Ingresos</code> o <code>count=Negocios</code>. Sin etiqueta, se muestra <i>Suma · Importe</i> en el idioma del usuario.<br/><b>Toda la tabla:</b> el plugin c8oforms de Baserow las calcula sobre todas las filas. Sin él, solo <code>count</code>, <code>sum</code>, <code>avg</code>, <code>min</code> y <code>max</code> con Agrupar por se calculan, sobre las filas leídas; las demás responden un error.<br/><b>Si este campo está vacío, se utiliza <code>count</code> por defecto con Agrupar por.</b>",
            "displayName": "Agregaciones"
        },
        "it": {
            "comment": "<b>Opzionale.</b><br/>Le aggregazioni del piè di una griglia Baserow (Riepiloga), separate da virgole: <code>count</code> o <code>tipo:Colonna</code>.<br/><b>Con Raggruppa per:</b> un valore per gruppo. <b>Senza Raggruppa per:</b> una riga per tutta la tabella.<br/><b>Tipi:</b><ul><li><code>count</code> (righe), <code>empty_count</code>, <code>not_empty_count</code>, <code>empty_percentage</code>, <code>not_empty_percentage</code>, <code>unique_count</code></li><li><code>checked_count</code>, <code>not_checked_count</code>, <code>checked_percentage</code>, <code>not_checked_percentage</code> per le colonne booleane</li><li><code>sum</code>, <code>avg</code>, <code>median</code>, <code>std_dev</code>, <code>variance</code> per le colonne numeriche</li><li><code>min</code>, <code>max</code> per le colonne numeriche o di data, <code>earliest_date</code>, <code>latest_date</code> per le colonne di data</li><li><code>distribution</code>: i 10 valori più frequenti con il loro numero e la loro quota</li></ul><b>Esempi:</b> <code>count</code>, <code>sum:Importo</code>, <code>empty_percentage:Email</code>, <code>latest_date:Creato</code><br/><b>Etichetta:</b> aggiungi <code>=Etichetta</code> per dare un nome al valore nelle legende dei grafici e nelle intestazioni delle griglie, ad esempio <code>sum:Importo=Ricavi</code> o <code>count=Affari</code>. Senza etichetta, appare <i>Somma · Importo</i> nella lingua dell''utente.<br/><b>Tutta la tabella:</b> il plugin c8oforms di Baserow le calcola su tutte le righe. Senza di esso, solo <code>count</code>, <code>sum</code>, <code>avg</code>, <code>min</code> e <code>max</code> con Raggruppa per sono calcolate, sulle righe lette; le altre rispondono un errore.<br/><b>Se il campo è vuoto, viene usato <code>count</code> per impostazione predefinita con Raggruppa per.</b>",
            "displayName": "Aggregazioni"
        }
    }
    '
  description: group_by_aggregations
