  '{
      "en": {
          "displayName": "Get data",
          "comment": "Get data from the no-code database table for a data grid. Each column of the table will be displayed as the same column in the data grid"
      },
      "fr": {
          "displayName": "Récupérer les données",
          "comment": "Récupérez les données d''une table no-code database pour une grille de données. Chaque colonne de la table sera affichée comme la même colonne dans la grille de données"
      },
      "es": {
          "displayName": "Obtener datos",
          "comment": "Obtenga datos de una tabla de no-code database para una cuadrícula de datos. Cada columna de la tabla se mostrará como la misma columna en la cuadrícula de datos"
      },
      "it": {
          "displayName": "Ottenere dati",
          "comment": "Ottieni dati da una tabella di no-code database per una griglia di dati. Ogni colonna della tabella verrà visualizzata come la stessa colonna nella griglia di dati"
      },
      "types": ["grid", "chart", "map", "gallery"]
  }'
