  expression: |
    'jConfig = JSON.parse(forms_config);
    table_id = jConfig.table_id;
    view_id = jConfig.view_id ? jConfig.view_id : null;
    var describeStructure = true;
    var hasConfiguredColumns = jConfig.columns != null;
    var isModelMode = model == "true" || model === true || model == "all_columns";
    var isAllColumnsModel = model == "all_columns";
    include_fields = null;
    var trimFieldName = function(value) {
    	if (value == null) {
    		return "";
    	}
    	return ("" + value).replace(/^\s+|\s+$/g, "");
    };
    var escapeBaserowFieldName = function(fieldName) {
    	fieldName = trimFieldName(fieldName);
    	if (fieldName == "") {
    		return "";
    	}
    	var escapedFieldName = fieldName.replace(/\\/g, "\\\\").replace(/"/g, "\\\"");
    	var mustQuote = fieldName.indexOf(",") != -1 || fieldName.indexOf("\"") != -1 || fieldName.indexOf("\\") != -1;
    	return mustQuote ? "\"" + escapedFieldName + "\"" : escapedFieldName;
    };
    var includeFieldNames = [];
    var includeFieldsMap = {};
    var addIncludeField = function(currentField) {
    	currentField = trimFieldName(currentField);
    	if (currentField != "" && includeFieldsMap[currentField] !== true) {
    		includeFieldNames.push(currentField);
    		includeFieldsMap[currentField] = true;
    	}
    };
    var buildIncludeFields = function() {
    	var escapedFields = [];
    	for (var iIncludeName = 0; iIncludeName < includeFieldNames.length; iIncludeName++) {
    		var escapedField = escapeBaserowFieldName(includeFieldNames[iIncludeName]);
    		if (escapedField != "") {
    			escapedFields.push(escapedField);
    		}
    	}
    	return escapedFields.join(",");
    };
    
    // For each column provider in the configuration, compute the list of fields we would like to retrieve
    // with the Baserow API.
    if (jConfig.columns) {
    	for (var iInitialColumn = 0; iInitialColumn < jConfig.columns.length; iInitialColumn++) {
    		addIncludeField(jConfig.columns[iInitialColumn]);
    	}
    	include_fields = buildIncludeFields();
    }
    
    // The Filter Expression is provided  directly in the form_fitler variable.
    filterExpression = forms_tableFilter;
    
    order_by = forms_tableSort;
    if (jConfig.columns == null) {
    	jConfig.columns = [];
    }
    if (jConfig.hidden == null) {
    	jConfig.hidden = [];
    }
    var appendUniqueColumn = function(targetColumns, targetColumnsMap, currentColumn) {
    	if (currentColumn == null) {
    		return;
    	}
    	currentColumn = trimFieldName(currentColumn);
    	if (currentColumn != "" && targetColumnsMap[currentColumn] !== true) {
    		targetColumns.push(currentColumn);
    		targetColumnsMap[currentColumn] = true;
    	}
    };
    var filterColumns = [];
    var filterColumnsMap = {};
    var collectFilterColumns = function(filterNode) {
    	if (filterNode == null) {
    		return;
    	}
    	if (Array.isArray(filterNode)) {
    		for (var iFilterArray = 0; iFilterArray < filterNode.length; iFilterArray++) {
    			collectFilterColumns(filterNode[iFilterArray]);
    		}
    		return;
    	}
    	if (filterNode.field != null) {
    		appendUniqueColumn(filterColumns, filterColumnsMap, filterNode.field);
    	}
    	if (filterNode.filters != null) {
    		collectFilterColumns(filterNode.filters);
    	}
    	if (filterNode.groups != null) {
    		collectFilterColumns(filterNode.groups);
    	}
    };
    if (forms_tableFilter != null && ("" + forms_tableFilter) != "") {
    	try {
    		collectFilterColumns(JSON.parse("" + forms_tableFilter));
    	}
    	catch (e) {
    	}
    }
    if (include_fields != null) {
    	for (var iInitialFilterColumn = 0; iInitialFilterColumn < filterColumns.length; iInitialFilterColumn++) {
    		addIncludeField(filterColumns[iInitialFilterColumn]);
    	}
    	include_fields = buildIncludeFields();
    }
    var buildModelColumns = function() {
    	if (hasConfiguredColumns !== true) {
    		return null;
    	}
    	var columns = [];
    	var columnsMap = {};
    	for (var iConfiguredColumn = 0; iConfiguredColumn < jConfig.columns.length; iConfiguredColumn++) {
    		appendUniqueColumn(columns, columnsMap, jConfig.columns[iConfiguredColumn]);
    	}
    	for (var iHiddenColumn = 0; iHiddenColumn < jConfig.hidden.length; iHiddenColumn++) {
    		appendUniqueColumn(columns, columnsMap, jConfig.hidden[iHiddenColumn]);
    	}
    	for (var iFilterModelColumn = 0; iFilterModelColumn < filterColumns.length; iFilterModelColumn++) {
    		appendUniqueColumn(columns, columnsMap, filterColumns[iFilterModelColumn]);
    	}
    	return columns;
    };
    var ensureIncludedField = function(currentField) {
    	if (include_fields != null) {
    		var previousLength = includeFieldNames.length;
    		addIncludeField(currentField);
    		if (includeFieldNames.length != previousLength || include_fields == "") {
    			include_fields = buildIncludeFields();
    		}
    	}
    };
    var ensureSortFieldsIncluded = function(rawSort) {
        if (rawSort == null || ("" + rawSort) == "") {
            return;
        }
        try {
            var parsedSort = JSON.parse("" + rawSort);
            if (parsedSort != null && parsedSort.sorts != null && parsedSort.sorts.length != null) {
                for (var iSort = 0; iSort < parsedSort.sorts.length; iSort++) {
                    if (parsedSort.sorts[iSort] != null && parsedSort.sorts[iSort].name != null) {
                        ensureIncludedField(parsedSort.sorts[iSort].name);
                    }
                }
            }
        }
        catch (e) {
        }
    };
    ensureSortFieldsIncluded(order_by);
    var parseColumnNames = function(rawColumns) {
    	var columns = [];
    	var columnsMap = {};
    	if (rawColumns != null) {
    		var rawColumnsArray = ("" + rawColumns).split(",");
    		for (var iColumn = 0; iColumn < rawColumnsArray.length; iColumn++) {
    			var currentColumn = trimFieldName(rawColumnsArray[iColumn]);
    			if (currentColumn != "" && columnsMap[currentColumn] !== true) {
    				columns.push(currentColumn);
    				columnsMap[currentColumn] = true;
    				ensureIncludedField(currentColumn);
    			}
    		}
    	}
    	if (columns.length == 0) {
    		return null;
    	}
    	return columns;
    };
    var parseAggregationSpecs = function(rawAggregations) {
    	var aggregations = [];
    	var aggregationMap = {};
    	if (rawAggregations != null) {
    		var rawAggregationsArray = ("" + rawAggregations).split(",");
    		for (var iAggregation = 0; iAggregation < rawAggregationsArray.length; iAggregation++) {
    			var currentAggregation = trimFieldName(rawAggregationsArray[iAggregation]);
    			if (currentAggregation == "") {
    				continue;
    			}
    			var separatorIndex = currentAggregation.indexOf(":");
    			var aggregationType = separatorIndex == -1 ? currentAggregation.toLowerCase() : trimFieldName(currentAggregation.substring(0, separatorIndex)).toLowerCase();
    			var aggregationColumn = separatorIndex == -1 ? null : trimFieldName(currentAggregation.substring(separatorIndex + 1));
    			if (["count", "sum", "avg", "min", "max"].indexOf(aggregationType) == -1) {
    				continue;
    			}
    			if (aggregationType != "count" && (aggregationColumn == null || aggregationColumn == "")) {
    				continue;
    			}
    			var aggregationSignature = aggregationType == "count" ? "count" : aggregationType + ":" + aggregationColumn;
    			if (aggregationMap[aggregationSignature] === true) {
    				continue;
    			}
    			if (aggregationColumn != null) {
    				ensureIncludedField(aggregationColumn);
    			}
    			aggregations.push({
    				type: aggregationType,
    				column: aggregationColumn,
    				key: aggregationType == "count" ? "count" : aggregationType + "_" + aggregationColumn
    			});
    			aggregationMap[aggregationSignature] = true;
    		}
    	}
    	if (aggregations.length == 0) {
    		return null;
    	}
    	return aggregations;
    };
    groupByColumns = parseColumnNames(forms_tableGroupBy);
    distinctColumns = parseColumnNames(forms_tableDistinct);
    aggregationSpecs = parseAggregationSpecs(forms_tableAggregations);
    if (groupByColumns != null) {
    	distinctColumns = null;
    	if (aggregationSpecs == null) {
    		aggregationSpecs = [{
    			type: "count",
    			column: null,
    			key: "count"
    		}];
    	}
    }
    else {
    	aggregationSpecs = null;
    }
    displayColumns = groupByColumns != null ? groupByColumns : jConfig.columns;
    page = "1";
    
    // If Forms asks us for a model, keep the grouped shape when Group by is used.
    if (isModelMode) {
    	var modelColumns = isAllColumnsModel ? null : buildModelColumns();
    	size = "1";
    	filterExpression = null;
    	order_by = null;
    	describeStructure = true;
    	distinctColumns = null;
    	if (groupByColumns == null) {
    		includeFieldNames = [];
    		includeFieldsMap = {};
    		if (modelColumns != null) {
    			for (var iModelIncludeColumn = 0; iModelIncludeColumn < modelColumns.length; iModelIncludeColumn++) {
    				addIncludeField(modelColumns[iModelIncludeColumn]);
    			}
    		}
    		include_fields = modelColumns != null ? buildIncludeFields() : null;
    		aggregationSpecs = null;
    		displayColumns = modelColumns;
    	}
    	else {
    		var groupedModelColumns = [];
    		var groupedModelColumnsMap = {};
    		for (var iGroupModelColumn = 0; iGroupModelColumn < groupByColumns.length; iGroupModelColumn++) {
    			appendUniqueColumn(groupedModelColumns, groupedModelColumnsMap, groupByColumns[iGroupModelColumn]);
    		}
    		if (modelColumns != null) {
    			for (var iModelColumn = 0; iModelColumn < modelColumns.length; iModelColumn++) {
    				ensureIncludedField(modelColumns[iModelColumn]);
    				appendUniqueColumn(groupedModelColumns, groupedModelColumnsMap, modelColumns[iModelColumn]);
    			}
    		}
    		displayColumns = groupedModelColumns;
    	}
    }
    var normalizeMaxSearchResults = function(value) {
        var parsed = parseInt(value, 10);
        if (isNaN(parsed) || parsed <= 0) {
            parsed = 1000;
        }
        return parsed;
    };
    max_search_results = normalizeMaxSearchResults(max_search_results);
    source_page_size = parseInt(typeof size == "undefined" ? "${lib_BaseRow.sourcepagesize=200}" : size, 10);
    if (isNaN(source_page_size) || source_page_size <= 0) {
        source_page_size = 200;
    }
    if (model != "true" && model !== true && model != "all_columns") {
        size = "" + Math.min(source_page_size, max_search_results);
    }
    var shouldExposeColumn = function(columnName) {
    	return displayColumns == null || displayColumns.indexOf(columnName) != -1;
    };
    
