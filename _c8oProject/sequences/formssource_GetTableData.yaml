    		file: true,
    		link_row: true,
    		multiple_collaborators: true,
    		multiple_select: true
    	};
    	for (var iStructureField = 0; iStructureField < structure.length; iStructureField++) {
    		var currentStructureField = structure[iStructureField];
    		aggregationColumnInfo[currentStructureField.name] = {
    			field: currentStructureField,
    			filterType: getBrFilterType(currentStructureField)
    		};
    	}
    	for (var iAggregationValidation = 0; iAggregationValidation < aggregationSpecs.length; iAggregationValidation++) {
    		var currentAggregationSpec = aggregationSpecs[iAggregationValidation];
    		if (currentAggregationSpec.type == "count") {
    			continue;
    		}
    		var currentAggregationInfo = aggregationColumnInfo[currentAggregationSpec.column];
    		if (currentAggregationInfo == null) {
    			aggregationError = "The aggregation column ''" + currentAggregationSpec.column + "'' was not found in the table structure.";
    			break;
    		}
    		var currentAggregationType = currentAggregationInfo.filterType.type;
    		if (currentAggregationInfo.filterType.isArray === true || unsupportedAggregationTypes[currentAggregationType] === true) {
    			aggregationError = "The aggregation ''" + currentAggregationSpec.type + "'' is not supported on column ''" + currentAggregationSpec.column + "'' of type ''" + currentAggregationType + "''.";
    			break;
    		}
    		if ((currentAggregationSpec.type == "sum" || currentAggregationSpec.type == "avg") && numericAggregationTypes[currentAggregationType] !== true) {
    			aggregationError = "The aggregation ''" + currentAggregationSpec.type + "'' is only supported on numeric columns. Column ''" + currentAggregationSpec.column + "'' is of type ''" + currentAggregationType + "''.";
    			break;
    		}
    	}
    }
    if (aggregationError == null) {
    	for (var elem of results) {
    	var obj = {};
    	var cpt = 0;
    	for (var key in elem) {
    		var html = "" + base_html;
    		var current = elem[key];
    		var currentType = null;
    		var isHiddenColumn = key == "id" || key == "order" || (jConfig.hidden ? jConfig.hidden.includes(key) : false);
    		if ("structure" in this) {
    			if (!Array.isArray(structure)) {
    				structure = [structure];
    			}
    			if (shouldExposeColumn(key)) {
    				var cTargetForType = structure.filter((x) => {
    					return x.name == key;
    				})[0];
    				if (cTargetForType != undefined) {
    					currentType = getBrFilterType(cTargetForType).type;
    				}
    			}
    		}
    		if (current != null) {
    			obj[key] = { displayName: key, type: "html", value: "" };
    			var result = computeAnyType(current, false, currentType);
    			html += result.innerHtml;
    			obj[key].value = result.value;
    			obj[key].displayValue = html;
    		} else {
    			obj[key] = { displayName: key, type: "html", value: null };
    		}
    		if (isHiddenColumn) {
    			obj[key].hidden = true;
    		}
    
    		if (model == "true" && "structure" in this) {
    			if (!Array.isArray(structure)) {
    				structure = [structure];
    			}
    			var cTargetCompletion = [];
    			var cHideFromFiltering = true;
    			var cTarget = null;
    			var result = {
    				type: null,
    				value: undefined
    			};
    			if (shouldExposeColumn(key)) {
    				cTarget = structure.filter((x) => {
    					return x.name == key;
    				})[0];
    				if (cTarget != null) {
    					result = getBrFilterType(cTarget)
    					obj[key]["cType"] = result.type;
    					cTargetCompletion = result.value;
    					cHideFromFiltering = false;
    					if (cTargetCompletion == undefined) {
    						cTargetCompletion = [];
    						cHideFromFiltering = true;
    					}
    					if (cTarget.type == "single_select" && obj[key].value == null) {
    						obj[key].value = {
    							id: 0,
    							value: "",
    							color: ""
    						};
    					}
    				}
    			}
    
    			obj[key]["filterCompletion"] = cTargetCompletion;
    			obj[key]["filterHide"] = cHideFromFiltering;
    			obj[key]["sortHide"] = cHideFromFiltering || result.type == "file" || result.type == "link_row" || (cTarget != undefined && cTarget.array_formula_type == "multiple_select")
    
    		}
    	}
    
    	var jReorderedRow = {};
    	jReorderedRow["id"] = obj["id"];
    	jReorderedRow["order"] = obj["order"];
    	if (displayColumns == null) {
    		if ("structure" in this) {
    			if (!Array.isArray(structure)) {
    				structure = [structure];
    			}
    			for (var iStructureField = 0; iStructureField < structure.length; iStructureField++) {
    				var structureFieldName = structure[iStructureField].name;
    				if (obj.hasOwnProperty(structureFieldName)) {
    					jReorderedRow[structureFieldName] = obj[structureFieldName];
    				}
    			}
    		}
    		for (var currentRowKey in obj) {
    			if (obj.hasOwnProperty(currentRowKey) && !jReorderedRow.hasOwnProperty(currentRowKey)) {
    				jReorderedRow[currentRowKey] = obj[currentRowKey];
    			}
    		}
    	}
    	else {
    		displayColumns.forEach((col) => {
    			if (obj.hasOwnProperty(col)) {
    				jReorderedRow[col] = obj[col];
    			}
    		});
    	}
    	if (groupByColumns != null) {
    		var groupSignature = buildSignature(obj, groupByColumns);
    		var groupedRow = groupedRows[groupSignature];
    		if (groupedRow == null) {
    			groupedRow = jReorderedRow;
    			groupedRows[groupSignature] = groupedRow;
    			groupedStates[groupSignature] = {};
    			data.push(groupedRow);
    		}
    		for (var iAggregationSpec = 0; iAggregationSpec < aggregationSpecs.length; iAggregationSpec++) {
    			var aggregationSpec = aggregationSpecs[iAggregationSpec];
    			var aggregationState = groupedStates[groupSignature][aggregationSpec.key];
    			if (aggregationState == null) {
    				aggregationState = {};
    				groupedStates[groupSignature][aggregationSpec.key] = aggregationState;
    			}
    			var aggregationSourceCell = aggregationSpec.column != null && obj.hasOwnProperty(aggregationSpec.column) ? obj[aggregationSpec.column] : null;
    			updateAggregationState(aggregationState, aggregationSpec, aggregationSourceCell);
    			groupedRow[aggregationSpec.key] = buildAggregateCell(aggregationSpec, aggregationState.value);
    		}
    		continue;
    	}
    	else if (distinctColumns != null) {
    		var distinctSignature = buildSignature(obj, distinctColumns);
    		if (distinctRows[distinctSignature] === true) {
    			continue;
    		}
    		distinctRows[distinctSignature] = true;
    	}
    	data.push(jReorderedRow);
    	}
    	
    	if ("structure" in this && data.length === 0) {
    	if (!Array.isArray(structure)) {
    		structure = [structure];
    	}
    
    	var row = {};
    
    	row["id"] = {
    		displayName: "id",
    		type: "html",
    		value: "",
    		hidden: true,
    		displayValue: "<div style=''display:flex; white-space: normal; align-items:center''></div>",
    		filterCompletion: [],
    		filterHide: true
    	};
    
    	row["order"] = {
    		displayName: "order",
    		type: "html",
    		value: "",
    		hidden: true,
    		displayValue: "<div style=''display:flex; white-space: normal; align-items:center''></div>",
    		filterCompletion: [],
    		filterHide: true
    	};
    
    	structure.forEach((field) => {
    		if (!shouldExposeColumn(field.name)) {
    			return;
    		}
    		var result = getBrFilterType(field);
    		
    		var cType = result.type;
    		var cTargetCompletion = result.value;
    		var cHideFromFiltering = false;
    		if (cTargetCompletion == undefined) {
    			cTargetCompletion = [];
    			cHideFromFiltering = true;
    		}
    
    		var value = "";
    		if (result.type === "single_select") {
    			value = { id: 0, value: "", color: "" };
    		} else if (result.type === "boolean") {
    			value = false;
    		} else if (result.isArray) {
    			value = [];
    		} else {
    			value = "";
    		}
    
    		row[field.name] = {
    			displayName: field.name,
    			type: "html",
    			value: value,
    			displayValue:
    				"<div style=''display:flex; white-space: normal; align-items:center''>" +
    				(typeof value === "string" ||
    				typeof value === "number" ||
    				typeof value === "boolean"
    					? value
    					: "") +
    				"</div>",
    			cType: cType,
    			filterCompletion: cTargetCompletion,
    			filterHide: cHideFromFiltering
    		};
    	});
    	if (aggregationSpecs != null) {
    		for (var iAggregationModel = 0; iAggregationModel < aggregationSpecs.length; iAggregationModel++) {
    			var aggregationModelSpec = aggregationSpecs[iAggregationModel];
    			row[aggregationModelSpec.key] = buildAggregateCell(aggregationModelSpec, aggregationModelSpec.type == "count" ? 0 : null);
    		}
    	}
    	if(model == "true"){
    		data.push(row);
    	}
    	else{
    		colDef = [];
    		colDef.push(row);
    	}
    	
    	}
    }
    '
