      		if (displayOptionValue != undefined && displayOptionValue != null && displayOptionValue !== "") {
      			options[displayOptionNames[iDisplayOption]] = "" + displayOptionValue;
      		}
      	}
      	var kind = displayKind(field);
      	if (kind == "date" || kind == "created_on" || kind == "last_modified") {
      		// (#1424) the timezone the cell is shown in: the forced one of the column, else the one of the server
      		// (lib_BaseRow.dateTimezone, UTC), as the cells formatted here; never "", the viewer would take the one of
      		// the browser and shift 12:45 UTC to 13:45 in Paris
      		var forcedTimezone = field.date_force_timezone != null ? ("" + field.date_force_timezone).trim() : "";
      		options.date_force_timezone = forcedTimezone != "" && forcedTimezone.toLowerCase() != "null" ? forcedTimezone : ("" + "${lib_BaseRow.dateTimezone=UTC}").trim() || "UTC";
      	}
      	return options;
      };
      for (var displayKey in leanFields) {
      	if (displayFieldsByName[displayKey] != null && leanFields[displayKey] != null) {
      		addDisplayOptions(leanFields[displayKey], displayFieldsByName[displayKey]);
      	}
      }
      // a grouped answer: an aggregate giving a number is shown in the format of its column (a sum or an average with the
      // decimal places of buildAggregateCell), a count as a whole number; a percentage, a distribution or a date keeps its HTML
      if (groupByColumns != null && aggregationSpecs != null) {
      	var countAggregations = ["count", "empty_count", "not_empty_count", "unique_count", "checked_count", "not_checked_count"];
      	var numberKinds = ["number", "autonumber", "count", "rating", "duration"];
      	for (var iDisplayAggregation = 0; iDisplayAggregation < aggregationSpecs.length; iDisplayAggregation++) {
      		var displaySpec = aggregationSpecs[iDisplayAggregation];
      		if (displaySpec.percentage === true || displaySpec.fieldKind != null) {
