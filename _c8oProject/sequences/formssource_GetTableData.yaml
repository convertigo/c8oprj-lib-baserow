    	};
    
    	row["order"] = {
    		displayName: "order",
    		type: "html",
    		value: "",
    		hidden: true,
    		displayValue: "<div style=''display:flex; white-space: normal; align-items:center''></div>",
    		filterCompletion: [],
    		filterHide: true
    	};
    
    	var appendedModelFields = {};
    	var appendModelField = function(field) {
    		if (field == null || field.name == null || appendedModelFields[field.name] === true || !shouldExposeColumn(field.name)) {
    			return;
    		}
    		appendedModelFields[field.name] = true;
    		var result = getBrFilterType(field);
    		
    		var cType = result.type;
    		var cTargetCompletion = result.value;
    		var cHideFromFiltering = false;
    		if (cTargetCompletion == undefined) {
    			cTargetCompletion = [];
    			cHideFromFiltering = true;
    		}
    
    		var value = "";
    		if (result.type === "single_select") {
    			value = { id: 0, value: "", color: "" };
    		} else if (result.type === "boolean") {
    			value = false;
    		} else if (result.isArray) {
    			value = [];
    		} else {
    			value = "";
    		}
    
    		var formattedModelValue = formatBaserowCell(value, field, false);
    		row[field.name] = {
    			displayName: field.name,
    			type: "html",
    			value: formattedModelValue.value,
    			displayValue: "<div style=''display:flex; white-space: normal; align-items:center''>" + formattedModelValue.innerHtml,
    			cType: cType,
    			filterCompletion: cTargetCompletion,
    			filterHide: cHideFromFiltering
    		};
    	};
    	if (displayColumns != null) {
    		var structureByName = {};
    		for (var iModelStructure = 0; iModelStructure < structure.length; iModelStructure++) {
    			structureByName[structure[iModelStructure].name] = structure[iModelStructure];
    		}
    		for (var iDisplayColumn = 0; iDisplayColumn < displayColumns.length; iDisplayColumn++) {
    			appendModelField(structureByName[displayColumns[iDisplayColumn]]);
    		}
    	}
    	for (var iFallbackStructure = 0; iFallbackStructure < structure.length; iFallbackStructure++) {
    		appendModelField(structure[iFallbackStructure]);
    	}
    	if (aggregationSpecs != null) {
    		for (var iAggregationModel = 0; iAggregationModel < aggregationSpecs.length; iAggregationModel++) {
    			var aggregationModelSpec = aggregationSpecs[iAggregationModel];
    			row[aggregationModelSpec.key] = buildAggregateCell(aggregationModelSpec, aggregationModelSpec.type == "count" ? 0 : null);
    		}
    	}
    	if(isModelMode){
    		data.push(row);
    	}
    	else{
    		colDef = [];
    		colDef.push(row);
    	}
    	
    	}
    }
    '
