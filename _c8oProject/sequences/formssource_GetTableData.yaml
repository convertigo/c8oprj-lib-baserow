      			}
      			aggregateDecimals = Math.min(Math.max(aggregateDecimals, 0), 10);
      		}
      		if (!isNaN(aggregateDecimals)) {
      			aggregateOptions.number_decimal_places = "" + aggregateDecimals;
      		}
      		if (displaySpecKind != "rating") {
      			addDisplayOptions(aggregateOptions, displaySpecField);
      		}
      		delete aggregateOptions.array_formula_type;
      		leanFields[displaySpec.key] = aggregateOptions;
      	}
      }'
