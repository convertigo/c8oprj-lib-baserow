      			aggregateOptions.duration_format = "" + displaySpecField.duration_format;
      		}
      		var aggregateDecimals = parseInt(displaySpecField.number_decimal_places, 10);
      		if (displaySpec.type != "min" && displaySpec.type != "max") {
      			// getAggregationDecimalPlaces: the decimal places of the column (2 without, 0 for a whole-number column), at least 2 for an average
      			if (isNaN(aggregateDecimals)) {
      				aggregateDecimals = ["autonumber", "count", "rating"].indexOf(displaySpecField.type) != -1 ? 0 : 2;
      			}
      			if (["avg", "median", "std_dev", "variance"].indexOf(displaySpec.type) != -1 && aggregateDecimals < 2) {
