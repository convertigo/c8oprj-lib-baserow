      		}
      		var displaySpecField = displaySpec.column != null ? displayFieldsByName[displaySpec.column] : null;
      		if (displaySpecField == null || ["sum", "avg", "median", "std_dev", "variance", "min", "max"].indexOf(displaySpec.type) == -1 ||
      			numberKinds.indexOf(displayKind(displaySpecField)) == -1) {
      			continue;
      		}
      		var displaySpecKind = displayKind(displaySpecField);
      		var aggregateOptions = { type: displaySpecKind == "duration" ? "duration" : "number", resolvedType: displaySpecKind == "duration" ? "duration" : "number", aggregate: "" + displaySpec.type };
