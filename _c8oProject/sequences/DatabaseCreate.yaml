accessibility: Private
comment: |
  Creates a new database (no-code base) in a workspace of the user, with the Baserow account of the user.
  The workspace must be one of the workspaces of the account (GET /api/workspaces/). The Baserow account of the call, never the Baserow admin account: authorization (a JWT of the user's account), else email and password, else the account of the authenticated C8Oforms user (C8Oforms.BaserowAccountGet); without account the call is refused.
jsonNativeOutput: true
nativeExecution: true
↓Run [steps.SimpleStep-1997100000101]: 
  comment: The Baserow calls run with the logs off and the token of the account stays in js/baserow_schema.js (never in the answer)
  expression: |
    'include("js/baserow_schema.js");
    result = BaserowSchema.engine.databaseCreate({
    	workspace_id: typeof workspace_id == "undefined" || workspace_id == null ? null : "" + workspace_id,
    	name: typeof name == "undefined" || name == null ? null : "" + name,
    	authorization: typeof authorization == "undefined" || authorization == null ? null : "" + authorization,
    	email: typeof email == "undefined" || email == null ? null : "" + email,
    	password: typeof password == "undefined" || password == null ? null : "" + password
    });'
↓result [steps.JsonToXmlStep-1997100000102]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: result
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
↓workspace_id [variables.RequestableVariable-1997100000111]: 
  comment: Id of the workspace, one of the workspaces of the user.
↓name [variables.RequestableVariable-1997100000112]: 
  comment: Name of the new base: 1 to 160 characters, without ~>.
↓authorization [variables.RequestableVariable-1997100000113]: 
  comment: JWT of the Baserow account of the user (JWT ...). When given, email and password are not used.
  value: 
    - ↑traceable: false
    - →→: 
  visibility: '-1'
↓email [variables.RequestableVariable-1997100000114]: 
  comment: Email of the Baserow account of the user, with password.
↓password [variables.RequestableVariable-1997100000115]: 
  comment: Password of the Baserow account of the user, with email.
  value: 
    - ↑traceable: false
    - →→: 
  visibility: '-1'
