      '// Baserow splits order_by like a CSV line (quote ", escape \): a name holding a comma,
      // a quote or a backslash is quoted, with the descending "-" inside the quotes.
      var toBaserowSortName = function(fieldName, descending) {
      	var sortName = (descending ? "-" : "") + fieldName;
      	var mustQuote = fieldName.indexOf(",") != -1 || fieldName.indexOf("\"") != -1 || fieldName.indexOf("\\") != -1;
      	return mustQuote ? "\"" + sortName.replace(/\\/g, "\\\\").replace(/"/g, "\\\"") + "\"" : sortName;
      };
      // A sort on a field Baserow cannot order (a file...) would fail the whole read: it is dropped (js/field_sort_source.js).
      var droppedSortNames = [];
      var keepSort = function(fieldName) {
      	if (canOrderBySortField(aFields, fieldName)) {
      		return true;
      	}
      	droppedSortNames.push(fieldName);
      	return false;
      };
      var buildBaserowOrderBy = function(rawOrder) {
      	var orderText = ("" + rawOrder).replace(/^\s+|\s+$/g, "");
      	if (orderText == "" || orderText == "null") {
      		return null;
      	}
      	if (orderText.charAt(0) != "{") {
      		// Already a Baserow order_by string: Name,-Age,"Field, with comma"
      		var orderItems = splitBaserowOrderBy(orderText);
      		var keptItems = [];
      		for (var iItem = 0; iItem < orderItems.length; iItem++) {
      			if (keepSort(orderItems[iItem].name)) {
      				keptItems.push(orderItems[iItem].raw);
      			}
      		}
      		return keptItems.length == orderItems.length ? orderText : (keptItems.length > 0 ? keptItems.join(",") : null);
      	}
      	var parsedOrder = JSON.parse(orderText);
      	var sortNames = [];
      	var sorts = parsedOrder != null && Array.isArray(parsedOrder.sorts) ? parsedOrder.sorts : [];
      	for (var iSort = 0; iSort < sorts.length; iSort++) {
      		if (sorts[iSort] != null && sorts[iSort].name != null && ("" + sorts[iSort].name) != "") {
      			var sortSource = getFormulaSortSource(aFields, "" + sorts[iSort].name);
      			var sortFieldName = sortSource != null ? sortSource.name : "" + sorts[iSort].name;
      			if (keepSort(sortFieldName)) {
      				sortNames.push(toBaserowSortName(sortFieldName, sorts[iSort].order != "asc"));
      			}
      		}
      	}
      	return sortNames.length > 0 ? sortNames.join(",") : null;
      };
      try {
      	order_by = buildBaserowOrderBy(order_by);
      }
      catch (e) {
      	order_by = null;
      }
      if (droppedSortNames.length > 0) {
      	log.info("Sort dropped, Baserow cannot order the rows by: " + droppedSortNames.join(", "));
      }
