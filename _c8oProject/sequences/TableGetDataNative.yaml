      		(fieldDefinition.type == "single_select" && SINGLE_SELECT_ID_FILTERS.indexOf(op) != -1) ||
      		(fieldDefinition.type == "multiple_select" && MULTIPLE_SELECT_ID_FILTERS.indexOf(op) != -1));
      	if (!usesOptionIds || isEmptyFilterValue(value)) {
      		return value;
      	}
      	var options = fieldDefinition.select_options;
      	options = Array.isArray(options) ? options : (options != null ? [options] : []);
      	var findOptionId = function(text) {
      		text = ("" + text).replace(/^\s+|\s+$/g, "");
      		var labelId = null;
      		for (var iOption = 0; iOption < options.length; iOption++) {
      			if (options[iOption] == null) {
      				continue;
      			}
      			if (("" + options[iOption].id) === text) {
      				return text;
      			}
      			if (labelId == null && ("" + options[iOption].value) === text) {
      				labelId = "" + options[iOption].id;
      			}
      		}
      		return labelId;
      	};
      	var wholeId = findOptionId(value);
      	if (wholeId != null) {
      		return wholeId;
      	}
      	if (op == "single_select_is_any_of" || op == "single_select_is_none_of") {
      		var parts = ("" + value).split(",");
      		var ids = [];
