      	if (fieldDefinition == null) {
      		return null;
      	}
      	if (["formula", "count", "rollup", "lookup"].indexOf(fieldDefinition.type) != -1) {
      		return fieldDefinition.formula_type == "array" ? "array" : fieldDefinition.formula_type;
      	}
      	return fieldDefinition.type;
      }
      
      function parseBooleanFilterText(value) {
      	var text = ("" + value).replace(/^\s+|\s+$/g, "").toLowerCase();
      	if (text == "true" || text == "1" || text == "yes" || text == "oui") {
      		return true;
      	}
      	if (text == "false" || text == "0" || text == "no" || text == "non") {
