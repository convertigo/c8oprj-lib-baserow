comment: Establishes a session with Baserow. Must be called before any other API
↓Init [steps.SimpleStep-1729154043239]: 
  expression: |
    'email += "";
    password += "";
    
    include("js/jwt.js");
    
    email = email ? email : "${lib_baserow.adminuser=fake}";
    password = password ? password : "${lib_baserow.password.secret=fake}";
    
    // keep_in_session=false (TokenGetOrRefresh): the HTTP session is left as is, the tokens are returned in
    // <auth> and only the refresh_token given by the caller is used (the one of the session can belong to
    // another Baserow account)
    keepInSession = ("" + keep_in_session) != "false";
    refreshToken = refresh_token == null || ("" + refresh_token) == "" || ("" + refresh_token) == "null" ? null : "" + refresh_token;
    if (refreshToken == null && keepInSession && context.httpSession.getAttribute("refresh_token") != null) {
    	refreshToken = "" + context.httpSession.getAttribute("refresh_token");
    }
    authTokens = function(answer, refreshed) {
    	var text = function(value) {
    		return value == null || typeof value == "object" ? "" : "" + value;
    	};
    	answer = answer != null && typeof answer == "object" ? answer : {};
    	var token = text(answer.access_token);
    	return {
    		token: token != "" ? token : text(answer.token),
    		refresh_token: text(answer.refresh_token),
    		refreshed: refreshed,
    		error: text(answer.error),
    		detail: text(answer.detail)
    	};
    };
    '
