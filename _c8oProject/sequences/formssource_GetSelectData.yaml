  expression: |
    'jConfig = JSON.parse(forms_config);
    table_id = jConfig.table_id;
    view_id = jConfig.view_id ? jConfig.view_id : null;
    var describeStructure = true;
    var displayValue = jConfig.displayValue != undefined ? jConfig.displayValue: jConfig.column;
    var value = jConfig.value != undefined ? jConfig.value : jConfig.line;
    
    var appendUniqueColumn = function(targetColumns, targetColumnsMap, currentColumn) {
    	if (currentColumn == null) {
    		return;
    	}
    	currentColumn = ("" + currentColumn).replace(/^\s+|\s+$/g, "");
    	if (currentColumn != "" && targetColumnsMap[currentColumn] !== true) {
    		targetColumns.push(currentColumn);
    		targetColumnsMap[currentColumn] = true;
    	}
    };
    var includeColumns = [];
    var includeColumnsMap = {};
    appendUniqueColumn(includeColumns, includeColumnsMap, displayValue);
    appendUniqueColumn(includeColumns, includeColumnsMap, value);
    
    var filterColumns = [];
    var filterColumnsMap = {};
    var collectFilterColumns = function(filterNode) {
    	if (filterNode == null) {
    		return;
    	}
    	if (filterNode.field != null) {
    		appendUniqueColumn(filterColumns, filterColumnsMap, filterNode.field);
    	}
    	if (filterNode.filters != null && filterNode.filters.length != null) {
    		for (var iFilter = 0; iFilter < filterNode.filters.length; iFilter++) {
    			collectFilterColumns(filterNode.filters[iFilter]);
    		}
    	}
    };
    if (forms_Filter != null && ("" + forms_Filter) != "") {
    	try {
    		collectFilterColumns(JSON.parse("" + forms_Filter));
    	}
    	catch (e) {
    	}
    }
    for (var iFilterColumn = 0; iFilterColumn < filterColumns.length; iFilterColumn++) {
    	appendUniqueColumn(includeColumns, includeColumnsMap, filterColumns[iFilterColumn]);
    }
    
    // Fetch only fields required to build the select values, plus fields used by filters/distinct.
    if (includeColumns.length > 0) {
    	include_fields = includeColumns.join(",");
    }
    
    filterExpression = forms_Filter;					// This is the Constructed Fiter API for baserow.
    
    order_by = forms_tableSort;
    distinctColumns = [];
    if (forms_tableDistinct != null) {
    	var rawDistinctColumns = ("" + forms_tableDistinct).split(",");
    	var distinctColumnsMap = {};
    	var includeFieldsMap = {};
    	if (include_fields != null && include_fields != "") {
    		var rawIncludeFields = include_fields.split(",");
    		for (var iIncludeField = 0; iIncludeField < rawIncludeFields.length; iIncludeField++) {
    			var currentIncludeField = rawIncludeFields[iIncludeField].replace(/^\s+|\s+$/g, "");
    			if (currentIncludeField != "") {
    				includeFieldsMap[currentIncludeField] = true;
    			}
    		}
    	}
    	for (var iDistinctColumn = 0; iDistinctColumn < rawDistinctColumns.length; iDistinctColumn++) {
    		var currentDistinctColumn = rawDistinctColumns[iDistinctColumn].replace(/^\s+|\s+$/g, "");
    		if (currentDistinctColumn != "" && distinctColumnsMap[currentDistinctColumn] !== true) {
    			distinctColumns.push(currentDistinctColumn);
    			distinctColumnsMap[currentDistinctColumn] = true;
    			if (include_fields != null) {
    				if (include_fields == "") {
    					include_fields = currentDistinctColumn;
    					includeFieldsMap[currentDistinctColumn] = true;
    				}
    				else if (includeFieldsMap[currentDistinctColumn] !== true) {
    					include_fields += "," + currentDistinctColumn;
    					includeFieldsMap[currentDistinctColumn] = true;
    				}
    			}
    		}
    	}
    }
    if (distinctColumns.length == 0) {
    	distinctColumns = null;
    }
    page = "1";
    
    if (model == "true") {
    	log.warn("Forms Model True")
    	size = "1";
    	filterExpression = null;
    	describeStructure = true;
    	order_by = null;
    	include_fields = null;
    }
    var normalizeMaxSearchResults = function(value) {
        var parsed = parseInt(value, 10);
        if (isNaN(parsed) || parsed <= 0) {
            parsed = 1000;
        }
        return parsed;
    };
    max_search_results = normalizeMaxSearchResults(max_search_results);
    source_page_size = parseInt(typeof size == "undefined" ? "${lib_BaseRow.sourcepagesize=200}" : size, 10);
    if (isNaN(source_page_size) || source_page_size <= 0) {
        source_page_size = 200;
    }
    if (model != "true") {
        size = "" + Math.min(source_page_size, max_search_results);
    }
    
    var search = forms_filter
    if(search == ""){
    	search = null;
    }'
