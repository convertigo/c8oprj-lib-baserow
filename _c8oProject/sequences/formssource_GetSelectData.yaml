    'jConfig = JSON.parse(forms_config);
    table_id = jConfig.table_id;
    // (view_id) the options are read through that view of the table: its filters on top of the ones of the source and of
    // the request, its sorts when nothing else sorts (js/table_views.js); an invalid one fails, never reads the whole table
    include("js/table_views.js");
    view_id = sourceViewId(jConfig);
    var describeStructure = true;
    var displayValue = jConfig.displayValue != undefined ? jConfig.displayValue: jConfig.column;
    var value = jConfig.value != undefined ? jConfig.value : jConfig.line;
