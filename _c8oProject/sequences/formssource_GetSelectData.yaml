    	if (durationFormat.indexOf("d h:mm") == 0) {
    		var dayClock = days + "d " + hours + ":" + padNumber(minutes, 2);
    		if (durationFormat.indexOf(":ss") != -1) {
    			dayClock += ":" + secondsText;
    		}
    		return sign + dayClock;
