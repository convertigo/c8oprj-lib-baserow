    	if (!/^-?\d+(\.\d+)?$/.test(numberSource)) {
    		return "" + value;
    	}
    	var numberValue = parseFloat(numberSource);
    	if (isNaN(numberValue)) {
    		return "" + value;
    	}
    	var decimalPlaces = parseInt(getFieldOption(field, "number_decimal_places"), 10);
