    expression: |
      '// convert XML to JSON doc
      var _jDoc = JSON.parse('''' + com.twinsoft.convertigo.engine.util.XMLUtils.XmlToJson(doc, true, true));
      var jDoc = JSON.parse(forms_freeVars);
      var columnToBeCreated = [];
      data = {};
      var fieldErrors = [];
      // The text of an answer, trimmed: "" when the field is unanswered.
      function answerText(value) {
      	return value == null ? "" : ("" + value).trim();
      }
      // A File, Photo or Signature field of the form as forms_AddRowFromData receives it: its answer ({type, value}), whose files
      // the attachment loop uploads, or a photo ({att_type}).
      function isFileAnswer(value) {
      	return value != null && typeof value == "object" && !Array.isArray(value) && (value.att_type === true || ["file", "img", "signature"].indexOf("" + value.type) != -1);
      }
      // No value: null, an empty text or an empty list.
      function isEmptyAnswer(value) {
      	return value == null || (Array.isArray(value) ? value.length == 0 : (typeof value != "object" && answerText(value) == ""));
      }
      // The names of the files of a File field, for a text column: what the viewer sent there before it sent the answer.
      function fileAnswerNames(value) {
      	var names = [];
      	(Array.isArray(value.value) ? value.value : [value.value]).forEach(function (file) {
      		var name = typeof file == "string" ? file : "";
      		// an attachment of the response: <field id>_C80C80_<file name>_C80C80_<time>
      		if (name.indexOf("_C80C80_") != -1) {
      			name = name.split("_C80C80_")[1];
      		}
      		if (name != "" && name.indexOf("data:") != 0) {
      			names.push(name);
      		}
      	});
      	return names.join(", ");
      }
      // An answer matching no option of a select column is reported as an error (it used to empty the cell or lose the row).
      function selectOptionError(key, value) {
      	var shown = value != null && typeof value == "object" ? JSON.stringify(value) : answerText(value);
      	fieldErrors.push("The answer \"" + shown + "\" of the field \"" + key + "\" is not an option of its select column");
      }
      // The id of the select option matching one answer, or null when no option matches. The label is tried first (exact,
      // then ignoring case), then a number is an option id only if that id exists: options labelled "1".."5" are found by label.
      function selectOptionId(fieldDef, value) {
      	var byId = false;
      	if (value != null && typeof value == "object" && !Array.isArray(value)) {
      		// an option object: {id} or {value}
      		byId = value.id != null;
      		value = byId ? value.id : value.value;
      	}
      	var text = answerText(value);
      	if (text == "") {
      		return null;
      	}
      	var options = fieldDef != null && Array.isArray(fieldDef.select_options) ? fieldDef.select_options : null;
      	if (options == null) {
      		// options unknown: a number is still an option id, a label is left to Baserow
      		return isNaN(+text) ? (byId ? null : text) : +text;
      	}
      	var i;
      	if (!byId) {
      		for (i = 0; i < options.length; i++) {
      			if (options[i] != null && options[i].id != null && answerText(options[i].value) == text) {
      				return +options[i].id;
      			}
      		}
      		for (i = 0; i < options.length; i++) {
      			if (options[i] != null && options[i].id != null && answerText(options[i].value).toLowerCase() == text.toLowerCase()) {
      				return +options[i].id;
      			}
      		}
      	}
      	if (!isNaN(+text)) {
      		for (i = 0; i < options.length; i++) {
      			if (options[i] != null && options[i].id != null && +options[i].id == +text) {
      				return +options[i].id;
      			}
      		}
      	}
      	return null;
      }
      // The option ids of a multiple select answer: an array (one option per item), a JSON array text, or a text that is
      // one option label or labels/ids separated by commas (the whole text is tried as a label before it is split).
      function normalizeMultipleSelectValue(rawValue, fieldDef, key) {
      	var resolved = [];
      	var seen = {};
      	function addOption(value) {
      		if (value == null || (typeof value != "object" && answerText(value) == "")) {
      			return;
      		}
      		var id = selectOptionId(fieldDef, value);
      		if (id == null) {
      			selectOptionError(key, value);
      		}
      		else if (!seen["" + id]) {
      			seen["" + id] = true;
      			resolved.push(id);
      		}
      	}
      	var values = null;
      	if (Array.isArray(rawValue)) {
      		values = rawValue;
      	}
      	else if (typeof rawValue == "string") {
      		var trimmed = rawValue.trim();
      		if (trimmed.charAt(0) == "[") {
      			try {
      				var parsed = JSON.parse(trimmed);
      				if (Array.isArray(parsed)) {
      					values = parsed;
      				}
      			}
      			catch (e) {
      				log.warn("Unable to parse a multiple_select JSON value");
      			}
      		}
      		if (values == null) {
      			var optionsKnown = fieldDef != null && Array.isArray(fieldDef.select_options);
      			values = trimmed.indexOf(",") == -1 || (optionsKnown && selectOptionId(fieldDef, trimmed) != null) ? [trimmed] : trimmed.split(",");
      		}
      	}
      	else {
      		values = [rawValue];
      	}
      	for (var v = 0; v < values.length; v++) {
      		addOption(values[v]);
      	}
      	return resolved;
      }
      // The links of a link row answer: an array, a {id}/{value} object, a JSON array text, or a text of row ids or
      // primary-field texts separated by commas. A number is a row id (the primary values of the linked table are unknown here).
      function normalizeLinkRowValue(rawValue) {
      	var links = [];
      	function addLink(value) {
      		if (value == null) {
      			return;
      		}
      		if (typeof value == "object") {
      			if (Array.isArray(value)) {
      				for (var l = 0; l < value.length; l++) {
      					addLink(value[l]);
      				}
      			}
      			else if (value.id != null) {
      				addLink(value.id);
      			}
      			else if (value.value != null) {
      				addLink(value.value);
      			}
      			return;
      		}
      		var text = answerText(value);
      		if (text != "") {
      			var num = Number(text);
      			links.push(isNaN(num) ? text : num);
      		}
      	}
      	if (rawValue != null && typeof rawValue == "object") {
      		addLink(rawValue);
      		return links;
      	}
      	var linkText = answerText(rawValue);
      	if (linkText.charAt(0) == "[") {
      		try {
      			var parsedLinks = JSON.parse(linkText);
      			if (Array.isArray(parsedLinks)) {
      				addLink(parsedLinks);
      				return links;
      			}
      		}
      		catch (e) {
      			log.warn("Unable to parse a link_row JSON value");
      		}
      	}
      	var parts = linkText.split(",");
      	for (var p = 0; p < parts.length; p++) {
      		addLink(parts[p]);
      	}
      	return links;
      }
      // A number answer: "" is an empty cell (Baserow refuses ""), a decimal comma is a decimal point ("3,5" is 3.5).
      function numberAnswer(value) {
      	var text = answerText(value);
      	if (text == "") {
      		return null;
      	}
      	if (typeof value == "number") {
      		return value;
      	}
      	if (typeof value == "object") {
      		return JSON.stringify(value);
      	}
      	return /^[+-]?\d*,\d+$/.test(text) ? text.replace(",", ".") : text;
      }
      // A date answer: "" is an empty cell (Baserow refuses ""). A date column without time keeps the YYYY-MM-DD part of the
      // answer as written: the viewer sends the local date, a conversion to UTC could shift the day.
      function dateAnswer(fieldDef, value) {
      	var text = answerText(value);
      	if (text == "") {
      		return null;
      	}
      	if (typeof value == "object") {
      		return JSON.stringify(value);
      	}
      	var withTime = fieldDef != null && (fieldDef.date_include_time === true || ("" + fieldDef.date_include_time) == "true");
      	if (!withTime && /^\d{4}-\d{2}-\d{2}([T ]|$)/.test(text)) {
      		return text.substring(0, 10);
      	}
      	return typeof value == "string" ? text : value;
      }
      for (var key in jDoc) {
      	
      	var obj  = jFields.find((object) => object.name === key )
      	var type = obj ? obj.type : null
      	
      	log.debug("** column [" + key + "], type " + type);
      	switch (type) {
      		case ''text'':
      		case ''long_text'':
      		case ''email'':
      		case ''phone_number'':
      		case ''password'':
      		case ''url'':
      			// an unanswered text is an empty cell: null was sent as the text "null"; a File field, the names of its files
      			data[key] = jDoc[key] == null ? null : (isFileAnswer(jDoc[key]) ? fileAnswerNames(jDoc[key]) : (typeof jDoc[key] != "object" ? jDoc[key] : JSON.stringify(jDoc[key])));
      			break;
      		case ''boolean'':
      			// an unanswered boolean is false: Baserow refuses "" and null (a boolean is never empty)
      			data[key] = answerText(jDoc[key]) == "" ? false : (typeof jDoc[key] != "object" ? jDoc[key] : JSON.stringify(jDoc[key]));
      			break;
      		case ''rating'':
      			// an unanswered rating is 0: Baserow refuses "" and null (a rating is never empty)
      			data[key] = answerText(jDoc[key]) == "" ? 0 : (typeof jDoc[key] != "object" ? jDoc[key] : JSON.stringify(jDoc[key]));
      			break;
      		case ''duration'':
      			// an unanswered duration leaves the cell empty: Baserow refuses ""
      			data[key] = answerText(jDoc[key]) == "" ? null : (typeof jDoc[key] != "object" ? jDoc[key] : JSON.stringify(jDoc[key]));
      			break;
      		case ''number'':
      			// an unanswered number leaves the cell empty: Baserow refuses "" (0 is a real answer)
      			data[key] = numberAnswer(jDoc[key]);
      			break;
      		case ''date'':
      			// an unanswered date leaves the cell empty: Baserow refuses ""
      			data[key] = dateAnswer(obj, jDoc[key]);
      			break;
      		case ''single_select'':
      			if (answerText(jDoc[key]) == "") {
      				// an unanswered choice leaves the cell empty: +"" is the option 0, which Baserow refuses
      				data[key] = null;
      			}
      			else {
      				var optionId = selectOptionId(obj, jDoc[key]);
      				if (optionId == null) {
      					selectOptionError(key, jDoc[key]);
      				}
      				else {
      					data[key] = optionId;
      				}
      			}
      			break;
      		case ''multiple_select'':
      			data[key] = normalizeMultipleSelectValue(jDoc[key], obj, key);
      			break;
      		case ''link_row'':
      			// an unanswered link leaves the cell empty and empty items are dropped ("12,"): Number("") is the row 0, which Baserow refuses
      			data[key] = normalizeLinkRowValue(jDoc[key]);
      			break;
      	
      		case ''file'':
      			data[key] = [];  // will be filled further on  by the attachment loop.
      			break;
      	
      		case null:
