    expression: |
      'var tokens = typeof loginTokens == "undefined" || loginTokens == null ? {} : loginTokens;
      var tokenText = function(value) {
      	return value == null || ("" + value) == "null" ? "" : "" + value;
      };
      var newToken = tokenText(tokens.token);
      if (newToken == "") {
      	var answerError = [tokenText(tokens.error), tokenText(tokens.detail)].filter(function(text) {
      		return text != "";
      	}).join(": ");
      	tokenError = "Baserow authentication failed" + (answerError != "" ? ": " + answerError : ": no token in the answer");
      } else {
      	var now = new Date().getTime();
      	var newRefreshToken = tokenText(tokens.refresh_token) != "" ? tokenText(tokens.refresh_token) : refresh_token;
      	// without credentials, a token that was not refreshed belongs to the Baserow admin account
      	var storeKey = refresh_only == "true" || tokenText(tokens.refreshed) == "true" || password || email ? tokenKey : "owner";
      	storeToken(storeKey, newToken, now, newRefreshToken);
      	if (keepAsPrevious) {
      		setPreviousToken(storeKey, newToken, now, newRefreshToken);
      	}
      	bearer = "JWT " + newToken;
      }
      '
