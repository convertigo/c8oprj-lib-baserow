accessibility: Private
comment: Gets a Baserow token for an account (email/password, the Baserow admin account when they are empty), from the HTTP session while it is valid, otherwise by refreshing it or logging in. With authorization (the Bearer of a previous call), that token is returned as is.
↓owner [steps.SimpleStep-1729093479669]: 
  expression: |
    'email += "";
    password += "";
    authorization = authorization == null ? "" : ("" + authorization).replace(/^\s+|\s+$/g, "");
    
    include("js/jwt.js");
    
    // The HTTP session keeps one Baserow token per account: token_for_<account>, token_timestamp_for_<account>
    // and refresh_token_for_<account>, <account> being the md5 of the credentials ("owner": the Baserow admin
    // account). token, token_timestamp, refresh_token and token_owner copy the token of the last account given
    // with credentials, for the callers without credentials ("use previous token").
    // The sources of a page run in parallel in the same session with different accounts: a token is never
    // removed from the session while another one is fetched, and this call returns its own token (bearer),
    // never the one that is in the session afterwards.
    var session = context.httpSession;
    var sessionValue = function(key) {
    	var value = session.getAttribute(key);
    	return value == null || ("" + value) == "" || ("" + value) == "null" ? null : "" + value;
    };
    storeToken = function(key, token, timestamp, refreshToken) {
    	session.setAttribute("token_for_" + key, token);
    	session.setAttribute("token_timestamp_for_" + key, timestamp);
    	if (refreshToken != null) {
    		session.setAttribute("refresh_token_for_" + key, refreshToken);
    	}
    };
    setPreviousToken = function(key, token, timestamp, refreshToken) {
    	session.setAttribute("token_owner", key);
    	session.setAttribute("token", token);
    	session.setAttribute("token_timestamp", timestamp);
    	if (refreshToken != null) {
    		session.setAttribute("refresh_token", refreshToken);
    	} else {
    		session.removeAttribute("refresh_token");
    	}
    };
    
    bearer = null;
    tokenError = null;
    tokenKey = null;
    keepAsPrevious = false;
    // AdminLogin returns the tokens of this call instead of writing them in the session
    keep_in_session = "false";
    refresh_token = null;
    refresh_only = "false";
    var token = null;
    var timestamp = null;
    
    if (/^(JWT|Bearer)\s+\S/i.test(authorization)) {
    	// token of the account already obtained by the caller (formscommon_CheckConfig)
    	var givenToken = authorization.replace(/^(JWT|Bearer)\s*/i, "");
    	if (isTokenStillValid(givenToken, null)) {
    		bearer = authorization;
    	} else {
    		// expires during a long call: renew the token of the same account, never use another account
    		var userId = getJwtUserId(givenToken);
    		var names = session.getAttributeNames();
    		while (userId != null && tokenKey == null && names.hasMoreElements()) {
    			var name = "" + names.nextElement();
    			if (name.indexOf("token_for_") == 0 && getJwtUserId(sessionValue(name)) == userId) {
    				tokenKey = name.substring("token_for_".length);
    			}
    		}
    		if (tokenKey == null) {
    			bearer = authorization;
    		} else {
    			token = sessionValue("token_for_" + tokenKey);
    			timestamp = session.getAttribute("token_timestamp_for_" + tokenKey);
    			if (token != null && isTokenStillValid(token, timestamp)) {
    				bearer = "JWT " + token;
    			} else {
    				refresh_token = sessionValue("refresh_token_for_" + tokenKey);
    				refresh_only = "true";
    				log.info("refresh the token given by the caller");
    			}
    		}
    	}
    } else if (password || email) {
    	tokenKey = "" + org.apache.commons.codec.digest.DigestUtils.md5Hex("owner:" + email + ":" + password);
    	keepAsPrevious = true;
    	token = sessionValue("token_for_" + tokenKey);
    	timestamp = session.getAttribute("token_timestamp_for_" + tokenKey);
    	if (token != null && isTokenStillValid(token, timestamp, true)) {
    		bearer = "JWT " + token;
    		setPreviousToken(tokenKey, token, timestamp, sessionValue("refresh_token_for_" + tokenKey));
    		log.info("reuse token for this account: " + email);
    	} else {
    		refresh_token = sessionValue("refresh_token_for_" + tokenKey);
    		log.info("no valid token for this account: " + email);
    	}
    } else {
    	// no account given: the token of the last account given with credentials, else the Baserow admin account
    	tokenKey = sessionValue("token_owner");
    	tokenKey = tokenKey == null ? "owner" : tokenKey;
    	keepAsPrevious = true;
    	token = sessionValue("token");
    	timestamp = session.getAttribute("token_timestamp");
    	if (token != null && isTokenStillValid(token, timestamp, true)) {
    		bearer = "JWT " + token;
    	} else {
    		refresh_token = sessionValue("refresh_token");
    	}
    	log.info("use previous token");
    }
    '
