accessibility: Private
comment: |
  Checks the row condition of a respondent write before it changes or deletes a row (C8Oforms js/action_access.js).
  formscommon_CheckConfig answered row_column: the step that runs this write may only change a row whose column holds
  what the condition of its grant allows. The row is read with the account of the source, without XML, and C8Oforms
  decides (BaserowPublishedRowAuthorize), with the texts the write puts in the column (written, js/row_rule.js).
  Answers an error (code 9, details row_denied) when the write is refused or the row cannot be read.
↓CheckRow [steps.SimpleStep-2026110902011]: 
  comment: The Bearer is only given to the raw transaction (no document, no log); the decision is made by C8Oforms from the grant of the session.
  expression: |
    'include("js/common.js");
    include("js/common2.js");
    rowConditionAllowed = false;
    try {
    	var rowFormsConfig = "" + forms_config;
    	var rowConfig = JSON.parse(rowFormsConfig);
    	var rowConfigFormId = rowConfig.form_id != null ? "" + rowConfig.form_id : "";
    	var rowProvidedFormId = forms_form_id != null && ("" + forms_form_id) != "" ? "" + forms_form_id : "";
    	// the row the write changes, exactly as the write names it: a Baserow row id (digits) or none for a creation
    	var checkedRowId = row_id == null ? "" : "" + row_id;
    	var checkedRow = null;
    	if (checkedRowId != "" && !/^[0-9]{1,18}$/.test(checkedRowId)) {
    		throw new Error("invalid row id");
    	}
    	if (checkedRowId != "") {
    		var readRow = jsonAnswer(callNative("lib_BaseRow.Baserow_API_spec._api_database_rows_table__table_id___row_id___GET_raw", {
    			"__header_Authorization": "" + authorization,
    			"table_id": "" + rowConfig.table_id,
    			"row_id": checkedRowId,
    			"user_field_names": "true"
    		}));
    		checkedRow = readRow != null && typeof readRow == "object" ? JSON.stringify(readRow) : null;
    	}
    	if (checkedRowId == "" || checkedRow != null) {
    		var rowAnswer = callSequence("C8Oforms", "BaserowPublishedRowAuthorize", {
    			form_id: rowProvidedFormId != "" ? rowProvidedFormId : rowConfigFormId,
    			forms_config: rowFormsConfig,
    			write_kind: "" + source_kind,
    			row_id: checkedRowId,
    			row: checkedRow,
    			written: written == null || ("" + written) == "" ? null : "" + written
    		});
    		var rowAllowedValue = rowAnswer && rowAnswer.document && rowAnswer.document.allowed;
    		rowConditionAllowed = rowAllowedValue != null && ("" + rowAllowedValue) == "true";
    	}
    } catch (e) {
    	log.warn("(CheckRow) the row condition could not be checked: " + e);
    	rowConditionAllowed = false;
    }'
